[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Match the private source exclusions in scripts/prepare_store_kit.py.
exclude = [
    "/tests/fixtures/iTunesDB/captured-album-index-36.b64",
    "/tests/fixtures/iTunesDB/captured-album-index-36.json",
    "/tests/fixtures/SQLiteDB/observed-postprocess-commands.plist",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iOpenPod", "src/device_registry", "src/iPodDB", "src/storage"]

[tool.hatch.build.targets.wheel.force-include]
"src/iopenpod_launcher.py" = "iopenpod_launcher.py"

[project]
name = "iOpenPod"
version = "2.0.3"
description = "iPod sync tool. Manage your iPod media library without iTunes."
authors = [{ name = "John Gibbons", email = "johngibbons167@gmail.com" }]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE",
    "COPYING.md",
    "ACKNOWLEDGEMENTS.md",
    "LICENSES/*.txt",
]
requires-python = ">=3.12,<3.13"
keywords = [
    "ipod",
    "ipod-classic",
    "itunes",
    "itunesdb",
    "music-sync",
    "ipod-manager",
    "music-library",
    "ipod-sync",
    "itunes-alternative",
    "acoustic-fingerprint",
]

dependencies = [
    "certifi>=2026.7.22",
    "feedparser>=6.0.12,<7",
    "keyring>=25.6,<26",
    "librosa>=0.11,<0.12",
    "mutagen>=1.48.1",
    "numba>=0.62.1,<0.63 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "numpy>=2.2,<3",
    "pillow>=12.3.0",
    "pycryptodome>=3.20,<4",
    "pyobjc-framework-mediaplayer>=12.1,<13 ; sys_platform == 'darwin'",
    "pyside6==6.9.3 ; sys_platform == 'darwin'",
    "pyside6>=6.11.2 ; sys_platform != 'darwin'",
    "tqdm>=4.70.0",
    "tzdata>=2026.2",
    "wasmtime>=36,<39",
    "winrt-runtime>=3.2.1,<4 ; sys_platform == 'win32'",
    "winrt-windows-applicationmodel>=3.2.1,<4 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=3.2.1,<4 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=3.2.1,<4 ; sys_platform == 'win32'",
    "winrt-windows-media>=3.2.1,<4 ; sys_platform == 'win32'",
    "winrt-windows-media-interop>=3.2.1,<4 ; sys_platform == 'win32'",
    "winrt-windows-services-store>=3.2.1,<4 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=3.2.1,<4 ; sys_platform == 'win32'",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]

[project.gui-scripts]
iopenpod = "iopenpod_launcher:run_with_crash_logging"

[project.optional-dependencies]
synesthesia-gpu = ["demucs>=4.0.1", "torch>=2.11.0", "torchaudio>=2.11.0"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'", extra = "synesthesia-gpu" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'", extra = "synesthesia-gpu" },
]
torchaudio = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'", extra = "synesthesia-gpu" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'", extra = "synesthesia-gpu" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.3,<0.17",
    "rumdl>=0.2.58,<0.3",
    "types-tqdm>=4.70.0.20260805,<5",
]
packaging = ["hatchling>=1.27,<2", "pyinstaller>=6.16,<7"]
packaging-checks = [
    "pytest>=9.1.1,<10",
]

[tool.iopenpod.packaging]
macos-minimum-version = "12.3"
macos-python-version = "3.12.14"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
xfail_strict = true

[tool.mypy]
python_version = "3.12"
files = ["main.py", "src", "scripts", "tests"]
mypy_path = ["src"]
explicit_package_bases = true
check_untyped_defs = true

strict = true

warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

strict_equality = true
strict_equality_for_none = true

disallow_any_unimported = true
disallow_any_decorated = true
disallow_any_generics = true
disallow_any_expr = false

pretty = true
show_error_codes = true
show_error_code_links = true

[tool.pyright]
exclude = [
    ".scratch",
    ".venv",
    "build",
    "dist",
    "**/__pycache__",
    "**/.*",
    "**/node_modules",
]
ignore = ["build", "dist"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
preview = false
select = [
    "E",
    "F",
    "W",
    "B",
    "I",
    "UP",
    "ANN",
    "C4",
    "N",
    "PERF",
    "PIE",
    "RET",
    "RUF",
    "SIM",
    "TC",
]
ignore = ["E501", "ANN401", "N802", "N815"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["device_registry", "iOpenPod", "iPodDB", "storage"]

[tool.ruff.format]
exclude = ["*.md"]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.rumdl]
disable = ["MD013"]
respect-gitignore = true
