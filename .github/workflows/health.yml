name: Health

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    # Qt 6.9's macOS stubs have known errors (ADR-0094). Keep one authoritative
    # type check with Windows bindings, and test both Mac architectures below.
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv sync --locked --managed-python
      - run: uv lock --check
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync rumdl check .
      - run: uv run --no-sync mypy

  health:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libpulse0 libasound2t64 udev

      - name: Install project and dev dependencies
        if: runner.os != 'macOS'
        run: uv sync --locked --managed-python --group packaging

      - name: Install macOS environment for the declared deployment target
        if: runner.os == 'macOS'
        run: uv run --no-project --managed-python --python 3.12 python scripts/sync_macos_build.py --with-checks

      - name: Test, including 1x/1.5x/2x display probes
        run: uv run --no-sync pytest
