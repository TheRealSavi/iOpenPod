name: Health

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 udev

      - name: Install project and dev dependencies
        run: uv sync --all-groups

      - name: Ruff
        run: uv run python scripts/dev.py lint

      - name: Mypy
        run: uv run python scripts/dev.py types

      - name: Pytest
        run: uv run python scripts/dev.py test

      - name: Architecture checks
        run: uv run python scripts/dev.py arch

      - name: Packaging smoke test
        run: |
          uv build
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python --no-deps dist/*.whl
          .wheel-smoke/bin/python scripts/smoke_test_installed_package.py
          .wheel-smoke/bin/iopenpod --version

      - name: Validate Linux identity rule syntax
        run: udevadm verify src/iopenpod/assets/linux/61-iopenpod.rules

      - name: Frozen application resource smoke test
        run: |
          uv run pyinstaller iOpenPod.spec --noconfirm
          dist/iOpenPod/iOpenPod --print-linux-udev-rule > frozen-rule.txt
          grep -q ID_IOPENPOD_PRODUCT_SERIAL frozen-rule.txt
          if grep -q 'TAG+="uaccess"\|MODE=' frozen-rule.txt; then
            echo "Frozen rule grants raw-device access" >&2
            exit 1
          fi
