name: Flatpak candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
      - name: Install build and desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils libegl1 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libpulse0 libasound2t64
      - run: uv sync --locked --group packaging
      - run: uv run --locked --group packaging python scripts/package_app.py freeze
      - run: uv run --locked --group packaging python scripts/package_app.py linux-stage
      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/linux/io.github.therealsavi.iOpenPod.desktop
          appstreamcli validate --no-net packaging/linux/io.github.therealsavi.iOpenPod.metainfo.xml
      - name: Install Flatpak SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Sdk//25.08 org.freedesktop.Platform//25.08
      - name: Build and check local Flatpak candidate
        run: |
          flatpak-builder --user --install --force-clean --repo=build/flatpak-repo build/flatpak packaging/linux/flatpak.json
          flatpak run --env=QT_QPA_PLATFORM=offscreen io.github.therealsavi.iOpenPod --smoke-test
          flatpak build-bundle build/flatpak-repo dist/iOpenPod-Linux-x86_64.flatpak io.github.therealsavi.iOpenPod
          sha256sum dist/iOpenPod-Linux-x86_64.flatpak > dist/iOpenPod-Linux-x86_64.flatpak.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-candidate
          if-no-files-found: error
          path: dist/*.flatpak*
