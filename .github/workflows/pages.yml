name: Build and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "tests/website/check_seo.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "tests/website/check_seo.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build website with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./website
          destination: ./_site
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.7"
      - name: Check rendered SEO, internal links, and structured data
        run: uv run --no-project --managed-python --python 3.12 python tests/website/check_seo.py _site
      - name: Prepare project-path hosting check
        run: |
          uv run --no-project --managed-python --python 3.12 python - <<'PY'
          from pathlib import Path
          from shutil import copytree

          copytree("website", "_project-site-source")
          config = Path("_project-site-source/_config.yml")
          text = config.read_text(encoding="utf-8")
          assert 'baseurl: ""' in text, "Expected custom-domain production configuration"
          config.write_text(text.replace('baseurl: ""', 'baseurl: "/iOpenPod"', 1), encoding="utf-8")
          PY
      - name: Build project-path hosting variant
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./_project-site-source
          destination: ./_site-project
      - name: Check SEO under project-path hosting
        run: uv run --no-project --managed-python --python 3.12 python tests/website/check_seo.py _site-project
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
