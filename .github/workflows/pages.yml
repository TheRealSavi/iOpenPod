name: Build and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "tests/website/check_seo.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "tests/website/check_seo.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build website with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./website
          destination: ./_site
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.7"
      - name: Check rendered SEO, internal links, and structured data
        run: uv run --no-project --managed-python --python 3.12 python tests/website/check_seo.py _site
      - name: Prepare project-path hosting check
        run: |
          uv run --no-project --managed-python --python 3.12 python - <<'PY'
          from pathlib import Path
          from shutil import copytree

          copytree("website", "_project-site-source")
          config = Path("_project-site-source/_config.yml")
          text = config.read_text(encoding="utf-8")
          assert 'baseurl: ""' in text, "Expected custom-domain production configuration"
          config.write_text(text.replace('baseurl: ""', 'baseurl: "/iOpenPod"', 1), encoding="utf-8")
          PY
      - name: Build project-path hosting variant
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./_project-site-source
          destination: ./_site-project
      - name: Check SEO under project-path hosting
        run: uv run --no-project --managed-python --python 3.12 python tests/website/check_seo.py _site-project
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
