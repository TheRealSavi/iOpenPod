name: Publish signed update feed

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published stable version, without v (also renews expiry)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      IOPENPOD_UPDATE_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: signed-update-feed
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-14
    timeout-minutes: 30
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.7"
          enable-cache: false
      - name: Install the locked release-signing environment
        run: uv sync --locked --no-dev --group packaging
      - name: Validate the requested version
        env:
          UPDATE_VERSION: ${{ inputs.version }}
        run: uv run --no-sync python -c 'import os; from iOpenPod.app.updates.releases import version_tuple; version_tuple(os.environ["UPDATE_VERSION"])'
      - name: Download the public native release assets
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_VERSION: ${{ inputs.version }}
        run: |
          gh release download "v$UPDATE_VERSION" --repo "$GITHUB_REPOSITORY" --dir build/update-archives --pattern "iOpenPod-$UPDATE_VERSION-*.zip"
          gh release download "v$UPDATE_VERSION" --repo "$GITHUB_REPOSITORY" --dir build/update-archives --pattern "iOpenPod-$UPDATE_VERSION-*.tar.gz"
      - name: Authenticate, sign, and publish the feeds atomically
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_VERSION: ${{ inputs.version }}
          IOPENPOD_UPDATE_PRIVATE_KEY: ${{ secrets.IOPENPOD_UPDATE_PRIVATE_KEY }}
        run: uv run --no-sync python -m scripts.publish_update_feed "$UPDATE_VERSION" build/update-archives build/signed-feed
