name: Build and release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub and PyPI (on main, creates v<pyproject version> after checks pass)"
        type: boolean
        default: false
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/package_app.py"
      - "scripts/package_updates.py"
      - "scripts/update_feed.py"
      - "scripts/publish_update_feed.py"
      - "src/iOpenPod/app/updates/**"
      - "src/iopenpod_update_helper.py"
      - "src/storage/host_installation.py"
      - "src/storage/host_usage.py"
      - "src/storage/platform/host_install_windows.py"
      - ".github/workflows/update-feed.yml"
      - "scripts/check_wheel.py"
      - "scripts/check_windows_bundle.py"
      - "scripts/check_macos_bundle.py"
      - "scripts/sync_macos_build.py"
      - "scripts/build_windows_sndfile.py"
      - "scripts/prepare_release_sources.py"
      - "scripts/assemble_github_release.py"
      - "scripts/prepare_release.py"
      - "tests/test_github_release.py"
      - "tests/test_prepare_release.py"
      - "src/iopenpod_launcher.py"
      - "src/iOpenPod/__main__.py"
      - "src/iOpenPod/assets/**"
      - "pyproject.toml"
      - "uv.lock"
      - "LICENSE"
      - "COPYING.md"
      - "ACKNOWLEDGEMENTS.md"
      - "LICENSES/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      create_tag: ${{ steps.release.outputs.create_tag }}
      signed_updates: ${{ steps.updates.outputs.enabled }}
      version: ${{ steps.updates.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
      - name: Validate release request and tag identity
        id: release
        env:
          PUBLISH_RELEASE: ${{ inputs.publish || false }}
        run: uv run --no-project --managed-python --python 3.12 python scripts/prepare_release.py
      - name: Read committed update trust configuration
        id: updates
        run: |
          uv run --no-project --managed-python --python 3.12 python -c 'import json,os,tomllib; from pathlib import Path; keys=json.loads(Path("packaging/update-keys.json").read_text())["public_keys"]; version=tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; Path(os.environ["GITHUB_OUTPUT"]).write_text("enabled="+str(bool(keys)).lower()+"\nversion="+version+"\n")'

  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libpulse0 libasound2t64
      - name: Install locked build environment
        if: runner.os != 'macOS'
        run: uv sync --locked --managed-python --no-dev --group packaging
      - name: Install macOS environment for the declared deployment target
        if: runner.os == 'macOS'
        run: uv run --no-project --managed-python --python 3.12 python scripts/sync_macos_build.py
      - name: Validate release tag before building
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: uv run --no-sync python scripts/package_app.py check-version "$RELEASE_TAG"
      - name: Build Python distributions
        run: uv build --no-build-isolation
      - name: Check wheel payload and launcher
        run: uv run --no-sync python scripts/check_wheel.py
      - name: Build source-audited Windows audio library
        if: runner.os == 'Windows'
        run: uv run --no-sync python -m scripts.build_windows_sndfile
      - name: Build unsigned native candidate
        run: uv run --no-sync python scripts/package_app.py freeze
      - name: Check the independent update helper
        if: runner.os != 'macOS'
        run: uv run --no-sync python -c "import subprocess,sys; from pathlib import Path; helper=Path('dist/iOpenPod-update'+('.exe' if sys.platform=='win32' else '')).resolve(); subprocess.run([str(helper),'--smoke-test'],check=True,timeout=120)"
      - name: Check Windows executable manifest and payload
        if: runner.os == 'Windows'
        run: uv run --no-sync python scripts/check_windows_bundle.py
      - name: Check every macOS native slice against the deployment target
        if: runner.os == 'macOS'
        run: uv run --no-sync python scripts/check_macos_bundle.py
      - name: Check Windows bundle outside the checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = (Resolve-Path dist/iOpenPod.exe).Path
          $report = Join-Path $env:RUNNER_TEMP 'frozen-runtime.txt'
          $arguments = '--smoke-test --smoke-test-report "' + $report + '"'
          $process = Start-Process -FilePath $executable -ArgumentList $arguments -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru -WindowStyle Hidden
          if (-not (Test-Path -LiteralPath $report)) { throw 'Frozen runtime check did not produce its report' }
          Get-Content -LiteralPath $report
          if ($process.ExitCode -ne 0) { throw "Frozen runtime check failed: $($process.ExitCode)" }
      - name: Check macOS bundle outside the checkout
        if: runner.os == 'macOS'
        run: |
          executable="$PWD/dist/iOpenPod.app/Contents/MacOS/iOpenPod"
          cd "$RUNNER_TEMP"
          "$executable" --smoke-test
      - name: Check Linux bundle outside the checkout
        if: runner.os == 'Linux'
        run: |
          executable="$PWD/dist/iOpenPod/iOpenPod"
          cd "$RUNNER_TEMP"
          "$executable" --smoke-test
      - name: Archive candidate with SHA-256
        run: uv run --no-sync python scripts/package_app.py archive
      - name: Check macOS drag-to-Applications disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(dist/iOpenPod-*-macOS-*.dmg)
          test "${#images[@]}" -eq 1
          mountpoint="$(mktemp -d "$RUNNER_TEMP/iopenpod-dmg.XXXXXX")"
          cleanup() {
            hdiutil detach "$mountpoint" >/dev/null 2>&1 || true
            rmdir "$mountpoint" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "${images[0]}"
          test -d "$mountpoint/iOpenPod.app"
          test -L "$mountpoint/Applications"
          test "$(readlink "$mountpoint/Applications")" = /Applications
          test -s "$mountpoint/.DS_Store"
          test -s "$mountpoint/.background/background.png"
          cmp "$mountpoint/iOpenPod.app/Contents/MacOS/iOpenPod" dist/iOpenPod.app/Contents/MacOS/iOpenPod
          codesign --verify --deep --strict "$mountpoint/iOpenPod.app"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.os }}
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/*.whl
            dist/*.sha256
            build/packaging/licenses/inventory.json
            build/packaging/macos-compatibility.json

  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: build/candidates
      - name: Fetch and verify pinned upstream sources
        run: uv run --no-project --managed-python --python 3.12 python scripts/prepare_release_sources.py --download
      - name: Assemble and verify the complete release
        run: uv run --no-project --managed-python --python 3.12 python -m scripts.assemble_github_release --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - name: Retain checked Python distributions for PyPI
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          if-no-files-found: error
          path: |
            release-assets/iopenpod-${{ needs.prepare.outputs.version }}-py3-none-any.whl
            release-assets/iopenpod-${{ needs.prepare.outputs.version }}.tar.gz
      - name: Retain supporting files as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-supporting-files
          compression-level: 0
          if-no-files-found: error
          path: |
            release-assets/*
            !release-assets/iOpenPod-*.zip
            !release-assets/iOpenPod-*.dmg
            !release-assets/iOpenPod-*-Linux-*.tar.gz
      # GITHUB_TOKEN tag pushes do not trigger another workflow. Publish here,
      # using the artifacts built and checked for this exact dispatch commit.
      - name: Create the requested version tag after successful validation
        if: needs.prepare.outputs.create_tag == 'true'
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
      - name: Upload native archives before making the release public
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" --verify-tag --target "$GITHUB_SHA" --draft --title "iOpenPod $RELEASE_TAG" --generate-notes --notes-file packaging/github-release.md release-assets/iOpenPod-*.zip release-assets/iOpenPod-*.dmg release-assets/iOpenPod-*-Linux-*.tar.gz
          gh release edit "$RELEASE_TAG" --draft=false --latest

  publish-pypi:
    needs: [prepare, publish]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/iOpenPod/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist
      # Reuse the assembled distributions; never rebuild under publish credentials.
      # UV accepts already-published files only when their contents match exactly.
      - name: Publish checked distributions to PyPI
        run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz

  update-feed:
    needs: [prepare, publish]
    if: needs.prepare.outputs.signed_updates == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/update-feed.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    # The same-repository signing workflow declares its required key.
    secrets: inherit
